# ACT settings shared by conditions A, B and C.
device: cuda
batch_size: 64
learning_rate: 0.0001
chunk_size: 20               # 20 control ticks = 1 second
n_action_steps: 1            # new observation and prediction every tick
num_workers: 4
log_freq: 100
selected_step: 2000          # checkpoint for the main evaluation
training_steps: 20000        # includes the additional checkpoint evaluation
save_steps: [2000, 20000]
execution: ensemble          # temporal ensembling, coefficient 0.01
